---
# ============================================================
# Foreman + Katello deployment — Rocky 9
#
# Phases:
#   0. Storage expansion — add data disk via ProxMox API (optional)
#   1. LVM setup         — carve up data disk for Pulp / containers / pgsql
#   2. SSL certificates  — obtain ACME cert via acme_sh (Cloudflare DNS01)
#   3. Foreman install   — install Foreman + Katello via foreman-installer
#   4. Foreman config    — configure Foreman via theforeman.foreman collection
#
# Note: the Foreman host is assumed to be an existing IPA domain member.
# IPA work (HTTP service principal, foreman-proxy keytab) is handled
# within the foreman_install role (tasks/ipa.yml), not by ipa_client.
#
# Usage — see Makefile for shorthand targets:
#   make deploy          # full run
#   make storage         # Phase 0 only — add disk + LVM
#   make install         # Phase 4 only
#   make config          # Phase 5 only
# ============================================================


# ============================================================
# Phase 0 — ProxMox storage expansion (optional)
# Skipped unless foreman_expand_storage: true in vars.yml.
# Discovers VMID automatically by hostname, adds disk, detects new
# block device, and sets proxmox_disk_device fact for Phase 1.
# ============================================================
- name: Foreman - ProxMox storage expansion
  hosts: foreman
  gather_facts: true
  become: true
  tags: [storage]
  roles:
    - role: mgcdrd.infrabase.proxmox_disk
      when: foreman_expand_storage | bool
      vars:
        proxmox_disk_api_host: "{{ foreman_proxmox_api_host }}"
        proxmox_disk_api_password: "{{ vault_pve_password }}"
        proxmox_disk_vm_name: "{{ foreman_hostname }}"
        proxmox_disk_slot: "{{ foreman_proxmox_data_disk }}"
        proxmox_disk_storage: "{{ foreman_proxmox_storage }}"
        proxmox_disk_size: "{{ foreman_proxmox_disk_size }}"
        proxmox_disk_state: present


# ============================================================
# Phase 1 — LVM setup
# Creates /var/lib/pulp, /var/lib/containers, /var/lib/pgsql.
# Uses proxmox_disk_device fact if Phase 0 ran, otherwise falls
# back to foreman_data_disk_device from vars.yml.
# Skipped if lvm_provision_vgs is empty.
# ============================================================
- name: Foreman - LVM data disk setup
  hosts: foreman
  become: true
  tags: [storage, lvm]
  vars:
    lvm_provision_vgs:
      - vg: vg_foreman
        pvs:
          - "{{ proxmox_disk_device | default(foreman_data_disk_device) }}"
  roles:
    - role: mgcdrd.infrabase.lvm2_provision
      when: foreman_data_disk_device is defined or proxmox_disk_device is defined


# ============================================================
# Phase 2 — SSL certificate (acme_sh)
# ============================================================
- name: Foreman - SSL certificate
  hosts: foreman
  become: true
  tags: [certs]
  roles:
    - role: mgcdrd.infrabase.acme_sh
      vars:
        acme_sh_email:    "{{ vault_acme_email }}"
        acme_sh_cf_key:   "{{ vault_acme_cf_key }}"
        acme_sh_cf_email: "{{ vault_acme_cf_email }}"
        acme_sh_certs:
          - domains:
              - "{{ foreman_hostname }}"
            challenge: dns_cf
            # RSA cert with ca.pem rooted to ISRG Root X1 — katello-certs
            # validates the chain to a self-contained root.
            keylength: "2048"
            complete_chain: true
            # On renewal: re-root the copied chain, then push it through the
            # installer (foreman-cert-renewal.sh, deployed by foreman_install).
            # Both are no-ops before Foreman is installed.
            reload_cmd: >-
              /usr/local/sbin/complete-le-chain.sh
              -f /etc/ssl/acme/{{ foreman_hostname }}/ca.pem
              -l /etc/ssl/acme/{{ foreman_hostname }}/cert.pem &&
              { test -x /usr/local/sbin/foreman-cert-renewal.sh &&
              /usr/local/sbin/foreman-cert-renewal.sh || true; }
            state: present


# ============================================================
# Phase 3 — Foreman + Katello installation
# ============================================================
- name: Foreman - install Foreman + Katello
  hosts: foreman
  become: true
  tags: [foreman_install]
  roles:
    - role: mgcdrd.infrasvc.foreman_install


# ============================================================
# Phase 4 — Foreman configuration
# ============================================================
- name: Foreman - configure Foreman
  hosts: foreman
  become: true
  tags: [foreman_config]
  roles:
    - role: mgcdrd.infrasvc.foreman_config
